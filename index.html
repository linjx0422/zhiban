<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>京西林场智能排班日历系统</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: auto;
      user-select: auto;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      gap: 15px;
      background: #f1f5f9;
      height: 100vh;
      overflow: hidden;
      color: #333;
    }
    /* 侧边栏 */
    .sidebar {
      width: 320px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 15px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    input[type="text"], textarea, select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      background: #fff;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
    }
    textarea { resize: vertical; min-height: 55px; }
    
    .staff-container {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px;
    }
    .staff-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #f8fafc;
      margin-bottom: 5px;
      border-radius: 4px;
      font-size: 13px;
    }
    .msg-toast {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 4px;
      display: none;
    }

    /* 主视窗 */
    .main {
      flex: 1;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 15px;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
    }
    .header-bar h2 { margin: 0; font-size: 18px; color: #1e293b; white-space: nowrap; }
    
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      margin-left: 8px;
      font-weight: 500;
    }
    .status-online { background: #dcfce7; color: #15803d; }
    .status-offline { background: #fef3c7; color: #b45309; }

    .jump-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #f8fafc;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }

    /* 三个排班计算卡片 */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }
    .control-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-card h4 { margin: 0; font-size: 14px; }
    .control-card .hint { font-size: 11px; min-height: 16px; font-weight: 500; }

    button {
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      white-space: nowrap;
    }
    button:hover { background: #f1f5f9; }
    button.primary {
      background: #2563eb;
      color: #fff;
      border: none;
      font-weight: 500;
    }
    button.primary:hover { background: #1d4ed8; }

    /* 日历 7 列网格 */
    .calendar-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    .week-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #f8fafc;
      border-bottom: 1px solid #cbd5e1;
      text-align: center;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 0;
    }
    .calendar-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: 1fr;
      overflow-y: auto;
      background: #e2e8f0;
      gap: 1px;
    }
    .calendar-cell {
      background: #ffffff;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 85px;
    }
    .calendar-cell.other-month { background: #f8fafc; opacity: 0.35; }
    .calendar-cell.workday { border-top: 3px solid #3b82f6; }
    .calendar-cell.weekend { border-top: 3px solid #10b981; }
    .calendar-cell.holiday { border-top: 3px solid #ef4444; background: #fff5f5; }

    .cell-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .date-num { font-size: 14px; font-weight: bold; color: #334155; }
    .type-badge {
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 3px;
      line-height: 1;
      white-space: nowrap;
    }
    .badge-workday { background: #dbeafe; color: #1e40af; }
    .badge-weekend { background: #d1fae5; color: #065f46; }
    .badge-holiday { background: #fee2e2; color: #b91c1c; font-weight: bold; }

    .duty-box { margin-top: 4px; }
    .duty-select {
      width: 100%;
      font-size: 12px;
      padding: 4px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-weight: 600;
      background: #fff;
    }
    .duty-select.assigned {
      background: #f0fdf4;
      border-color: #86efac;
      color: #166534;
    }
  </style>
</head>
<body>
  <!-- 侧边栏 -->
  <div class="sidebar">
    <h3 style="margin-top:0; font-size: 16px;">值班人员管理</h3>
    
    <!-- 单条录入 -->
    <div class="input-section">
      <div style="display: flex; gap: 6px;">
        <input type="text" id="single-name-input" placeholder="输入姓名按回车或点添加">
        <button id="btn-single-add" class="primary" style="white-space:nowrap;">添加</button>
      </div>
    </div>

    <!-- 批量录入 -->
    <div class="input-section">
      <textarea id="batch-staff-input" placeholder="批量粘贴：可用空格、逗号、顿号或换行分隔"></textarea>
      <div style="display:flex; gap:6px;">
        <button id="btn-batch-add" class="primary" style="flex:1;">批量导入</button>
        <button id="btn-clear-all" style="color:#dc2626;">清空全员</button>
      </div>
      <div id="sidebar-toast" class="msg-toast"></div>
    </div>

    <div id="staff-list" class="staff-container"></div>
    <div style="font-size: 11px; color: #64748b; margin-top: 8px;">
      * 排班按当前列表自上而下顺序循环。修改即时保存在本地。
    </div>
  </div>

  <!-- 主体工作区 -->
  <div class="main">
    <div class="header-bar">
      <!-- 标题与状态 -->
      <div style="display: flex; align-items: center;">
        <h2 id="current-month-display">2026年 9月</h2>
        <span id="sub-status" class="status-badge status-offline">正在检查节假日...</span>
      </div>

      <!-- 快速跳转月份组件 -->
      <div class="jump-group">
        <label style="font-size: 12px; color: #475569;">跳转到：</label>
        <select id="jump-year-select" style="width: 85px; padding: 3px 6px; font-size: 12px;"></select>
        <select id="jump-month-select" style="width: 70px; padding: 3px 6px; font-size: 12px;"></select>
        <button id="btn-jump-month" class="primary" style="padding: 3px 8px; font-size: 12px;">Go</button>
      </div>

      <!-- 工具操作与翻月 -->
      <div style="display: flex; gap: 6px; align-items: center;">
        <button id="btn-sync-holidays" style="background:#0f766e; color:#fff; border:none; font-weight:500;">🔄 更新节假日</button>
        <button id="prev-month-btn">◀ 上月</button>
        <button id="next-month-btn">下月 ▶</button>
      </div>
    </div>

    <!-- 三个排班控制卡片 (点击后自动顺延排至当年 12 月 31 日) -->
    <div class="controls">
      <!-- 1. 工作日 -->
      <div class="control-card">
        <h4 style="color:#1d4ed8;">1. 工作日 (含调休上班)</h4>
        <div style="display:flex; align-items:center; gap:6px;">
          <label style="font-size:12px;">首位人:</label>
          <select id="select-workday-start" style="flex:1;"></select>
        </div>
        <div id="hint-workday" class="hint"></div>
        <button id="btn-calc-workday" class="primary">计算工作日 (顺延至年底)</button>
      </div>

      <!-- 2. 常规周末 -->
      <div class="control-card">
        <h4 style="color:#047857;">2. 常规公休周末</h4>
        <div style="display:flex; align-items:center; gap:6px;">
          <label style="font-size:12px;">首位人:</label>
          <select id="select-weekend-start" style="flex:1;"></select>
        </div>
        <div id="hint-weekend" class="hint"></div>
        <button id="btn-calc-weekend" class="primary" style="background:#059669;">计算常规周末 (顺延至年底)</button>
      </div>

      <!-- 3. 法定节假日 -->
      <div class="control-card">
        <h4 style="color:#b91c1c;">3. 法定节假日</h4>
        <div style="display:flex; align-items:center; gap:6px;">
          <label style="font-size:12px;">首位人:</label>
          <select id="select-holiday-start" style="flex:1;"></select>
        </div>
        <div id="hint-holiday" class="hint"></div>
        <button id="btn-calc-holiday" class="primary" style="background:#dc2626;">计算法定节假日 (顺延至年底)</button>
      </div>
    </div>

    <!-- 7 列日历网格 -->
    <div class="calendar-container">
      <div class="week-headers">
        <div>周一</div>
        <div>周二</div>
        <div>周三</div>
        <div>周四</div>
        <div>周五</div>
        <div style="color:#059669;">周六</div>
        <div style="color:#059669;">周日</div>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
